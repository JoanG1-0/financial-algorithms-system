# ETL Service - Puerto por defecto 8082 (override: SERVER_PORT)
server.port=${SERVER_PORT:8082}

twelvedata.base-url=https://api.twelvedata.com
twelvedata.api-key=${TWELVE_DATA_API_KEY:}
twelvedata.connect-timeout-ms=5000
twelvedata.read-timeout-ms=30000

# DataSource (override via environment variables in Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/etl_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Batch download configuration
batch.symbols=AAPL,MSFT,GOOGL,AMZN,META,TSLA,NVDA,JPM,JNJ,V,NFLX,AMD,INTC,DIS,WMT,BAC,KO,PG,IBM,ORCL
batch.rate-limit.max-per-minute=8
batch.rate-limit.pause-ms=60000
