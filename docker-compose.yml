# =============================================================================
# Infraestructura + Servicios
# Levanta: PostgreSQL, Jenkins, SonarQube, ETL Service, Algorithm Service, Report Service, Gateway Service
# Comando: docker-compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - Base de datos por microservicio (US-03)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: financial-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    networks:
      - financial-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Jenkins - CI/CD (US-04)
  # ---------------------------------------------------------------------------
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: financial-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
    environment:
      JAVA_OPTS: "-Djava.awt.headless=true -Xmx512m"
    networks:
      - financial-network
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # SonarQube - Calidad de código (US-34)
  # Community Edition usa base de datos embebida (H2)
  # ---------------------------------------------------------------------------
  sonarqube:
    image: sonarqube:10.3.0-community
    container_name: financial-sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - financial-network
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # ETL Service - Extracción, transformación y carga (US-etl)
  # ---------------------------------------------------------------------------
  etl-service:
    build:
      context: .
      dockerfile: etl-service/Dockerfile
    container_name: financial-etl
    ports:
      - "8082:8082"
    env_file: 
      - etl-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/etl_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - financial-network
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Algorithm Service - Análisis algorítmico financiero
  # ---------------------------------------------------------------------------
  algorithm-service:
    build:
      context: .
      dockerfile: algorithm-service/Dockerfile
    container_name: financial-algorithm
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/algorithm_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ETL_SERVICE_URL: http://etl-service:8082
    networks:
      - financial-network
    depends_on:
      postgres:
        condition: service_healthy
      etl-service:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Report Service - Reportes financieros (US-20)
  # ---------------------------------------------------------------------------
  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    container_name: financial-report
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/report_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ALGORITHM_SERVICE_URL: http://algorithm-service:8083
    networks:
      - financial-network
    depends_on:
      postgres:
        condition: service_healthy
      algorithm-service:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Gateway Service - Punto de entrada único (puerto 8081)
  # ---------------------------------------------------------------------------
  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: financial-gateway
    ports:
      - "8081:8081"
    environment:
      ETL_SERVICE_URL: http://etl-service:8082
      ALGORITHM_SERVICE_URL: http://algorithm-service:8083
      REPORT_SERVICE_URL: http://report-service:8084
    networks:
      - financial-network
    depends_on:
      etl-service:
        condition: service_started
      algorithm-service:
        condition: service_started
      report-service:
        condition: service_started

# =============================================================================
# Volúmenes persistentes - Los datos sobreviven a reinicios
# =============================================================================
volumes:
  postgres_data:
  jenkins_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

# =============================================================================
# Red común - Los servicios se comunican por nombre
# =============================================================================
networks:
  financial-network:
    driver: bridge
