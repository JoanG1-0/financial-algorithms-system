# Gateway Service - Puerto por defecto 8081 (override: SERVER_PORT)
server.port=${SERVER_PORT:8081}
spring.application.name=gateway-service

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ── ETL Service route ─────────────────────────────────────────────────────────
spring.cloud.gateway.routes[0].id=etl-service
spring.cloud.gateway.routes[0].uri=${ETL_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/etl/**

# ── Algorithm Service route ───────────────────────────────────────────────────
spring.cloud.gateway.routes[1].id=algorithm-service
spring.cloud.gateway.routes[1].uri=${ALGORITHM_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/algorithm/**

# ── Report Service route ──────────────────────────────────────────────────────
spring.cloud.gateway.routes[2].id=report-service
spring.cloud.gateway.routes[2].uri=${REPORT_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/reports/**
