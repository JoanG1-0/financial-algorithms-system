# Algorithm Service - Puerto por defecto 8083 (override: SERVER_PORT)
server.port=${SERVER_PORT:8083}

spring.application.name=algorithm-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/algorithm_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

etl.service.url=${ETL_SERVICE_URL:http://localhost:8082}
etl.service.cleaned-prices-path=/api/etl/transform/cleaned-prices
