# Algorithm Service - Puerto por defecto 8083 (override: SERVER_PORT)
server.port=${SERVER_PORT:8083}

spring.application.name=algorithm-service

spring.datasource.url=jdbc:postgresql://localhost:5432/algorithm_db
spring.datasource.username=financial_user
spring.datasource.password=financial_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

etl.service.url=http://localhost:8082
etl.service.cleaned-prices-path=/api/etl/transform/cleaned-prices
